zerops:
  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - pnpm install --frozen-lockfile
        - pnpm build
      deployFiles:
        - ./dist/~
      cache:
        - node_modules
    run:
      base: static
      type: spa

  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - pnpm install --frozen-lockfile
        - pnpm build
      deployFiles:
        - dist
        - package.json
        - node_modules
        - apps
        - packages
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
      start: pnpm run start

  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - pnpm install --frozen-lockfile
        - pnpm run build
      deployFiles:
        - dist
        - package.json
        - node_modules
        - apps
        - packages
      cache:
        - node_modules
    run:
      base: nodejs@22
      start: pnpm run worker
